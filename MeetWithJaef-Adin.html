#md .e{color:#ff6b6b;font-size:13px;min-height:18px}.nbody{padding:16px;white-space:pre-wrap;font-weight:400;line-height:1.55}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sl=ms=>new Promise(r=>setTimeout(r,ms));
let ac,cur='lock',playing=false,cr=null,from='im';
function tone(f,d,t='sine',v=.07,at=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
