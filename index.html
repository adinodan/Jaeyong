<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPhone 15 Simulator</title>
    <style>
        :root {
            --sf-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--sf-font);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Simulator iPhone 15 */
        .iphone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 932px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        @media (min-width: 500px) {
            .iphone-frame {
                border-radius: 50px;
                border: 12px solid #2d2d2d;
                height: 92vh;
            }
        }

        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            pointer-events: none;
        }

        .status-left {
            margin-top: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }

        .status-right svg {
            fill: #ffffff;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background-color: #000000;
            border-radius: 20px;
            z-index: 101;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .dynamic-island.expanded {
            width: 320px;
            height: 80px;
            border-radius: 40px;
            padding: 15px 20px;
        }
