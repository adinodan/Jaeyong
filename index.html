<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 15 Web Simulator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN untuk Ikon iOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Pengaturan Font SF Pro / Apple System Font */
        body, button, input, div {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'SF Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Styling Frame iPhone 15 Pro */
        .iphone-container {
            width: 393px;
            height: 852px;
            border-radius: 55px;
            box-shadow: 
                0 0 0 12px #2d2d2d,
                0 0 0 15px #4a4a4f,
                0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            background: #000;
            transition: all 0.3s ease;
        }

        /* Bezel Layar */
        .iphone-screen {
            width: 100%;
            height: 100%;
            border-radius: 48px;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        /* Dynamic Island */
        .dynamic-island {
            width: 120px;
            height: 35px;
            background-color: #000;
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: white;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .dynamic-island.expanded {
            width: 350px;
            height: 85px;
            border-radius: 40px;
            top: 10px;
            padding: 15px 20px;
        }

        /* Wallpaper Overlay */
        .lockscreen-bg {
            background-image: url('https://i.ibb.co.com/KjnQVSrS/wallpaper.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Home Indicator (Garis Bawah) */
        .home-indicator {
            width: 134px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
        }

        /* Animasi Transisi Halaman */
        .screen-slide-up {
            transform: translateY(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        /* Keypad Button Glassmorphism */
        .keypad-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.15s ease;
        }

        .keypad-btn:active {
            background: rgba(255, 255, 255, 0.45);
        }

        /* Lockscreen Blur Effect saat Passcode terbuka */
        .blur-lockscreen {
            backdrop-filter: blur(30px) brightness(0.8);
            -webkit-backdrop-filter: blur(30px) brightness(0.8);
        }

        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
